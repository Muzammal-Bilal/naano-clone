{% extends "base.html" %}
{% block title %}Page not found | Campfire{% endblock %}

{% block content %}
<section class="hero-ember min-h-[calc(100vh-72px)] grid place-items-center px-5 py-20 text-center">
  <div>
    <p class="text-sm font-bold tracking-widest text-ember-soft">404</p>
    <h1 class="mt-4 font-display text-paper text-[clamp(2.25rem,6vw,4rem)] font-bold tracking-tight">
      That page isn't here.
    </h1>
    <p class="mt-5 max-w-md mx-auto text-lg text-paper/65">
      The link may be out of date, or the campaign may belong to another account.
    </p>
    <a href="{% url 'home' %}"
       class="mt-9 inline-flex items-center gap-3 bg-ember text-white rounded-lg px-8 h-14 font-bold text-lg hover:bg-ember-soft transition">
      Back to home <span>&rarr;</span>
    </a>
  </div>
</section>
{% endblock %}
