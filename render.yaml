# Render blueprint. Creating the database and wiring DATABASE_URL here rather
# than by hand removes the one step that silently falls back to SQLite when it
# is mistyped.
databases:
  - name: naano-db
    databaseName: naano
    user: naano
    plan: free

services:
  - type: web
    name: naano
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrate and seed run at start, not at build, so they reach the database
    # with the same environment the web process uses. Both are no-ops once the
    # data is there, which keeps restarts cheap.
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo --if-empty && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: naano-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
